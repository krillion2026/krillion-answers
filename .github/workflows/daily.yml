name: Update Krillion Answers
on:
  schedule:
    - cron: '5 4 * * *' # Runs at 04:05 UTC (5 mins after Krillion reset)
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add answers.json
          git commit -m "Update answers for today" || exit 0
          git push
